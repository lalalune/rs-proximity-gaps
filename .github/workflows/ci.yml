name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean-build:
    name: Lean 4 build (${{ matrix.lean_dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lean_dir: paper1/lean
            target: FRISoundness
            sorry_dir: FRISoundness/
          - lean_dir: lean
            target: FRISoundness.Berlekamp
            sorry_dir: FRISoundness/Berlekamp/
    defaults:
      run:
        working-directory: ${{ matrix.lean_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          lean --version
          lake --version

      - name: Cache Mathlib + .lake
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.lean_dir }}/.lake
          key: lean-${{ runner.os }}-${{ matrix.lean_dir }}-${{ hashFiles(format('{0}/lean-toolchain', matrix.lean_dir), format('{0}/lakefile.toml', matrix.lean_dir)) }}
          restore-keys: |
            lean-${{ runner.os }}-${{ matrix.lean_dir }}-
            lean-${{ runner.os }}-

      - name: lake update + cache get
        run: |
          lake update
          lake exe cache get || true

      - name: lake build
        run: lake build ${{ matrix.target }}

      - name: Verify zero sorry in named theorems
        run: |
          # Match `sorry` as a real Lean token (not as a backticked reference
          # in a docstring like `sorry`). We strip backtick-wrapped occurrences
          # and any obviously-comment lines before searching.
          # NOTE: use grep -F here -- in GNU grep `\`` is the start-of-buffer
          # anchor, not a literal backtick, so a regex `\`sorry\`` would only
          # match a line that is exactly "sorry" and never filter docstrings.
          hits=$(grep -RIn --include='*.lean' -E '\bsorry\b' ${{ matrix.sorry_dir }} \
                 | grep -vF '`sorry`' \
                 | grep -v -E '^[^:]+:[0-9]+:\s*--' \
                 || true)
          if [ -n "$hits" ]; then
            echo "::error::Found sorry in Lean source"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sorry in ${{ matrix.sorry_dir }}"

      - name: List axioms (informational)
        run: |
          echo "Axioms used (excluding standard logic):"
          grep -RIn --include='*.lean' '^axiom ' ${{ matrix.sorry_dir }} || true

  python-scripts:
    name: Python verification scripts (sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sample verification scripts
        run: |
          set -e
          # Quick smoke tests of representative scripts from each topic.
          # Each script is self-contained and uses only the standard library.
          python3 paper1/scripts/ca-bound/audit_critical_inequality.py
          python3 paper1/scripts/op1-barrier/op1_scaling.py
          python3 paper1/scripts/fri-coupling/audit_fri_coupling.py
          python3 scripts/ca-bound/audit_critical_inequality.py
          python3 scripts/op1-barrier/op1_scaling.py
          python3 scripts/fri-coupling/audit_fri_coupling.py
